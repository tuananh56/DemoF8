<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập JavaScript</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <div class="bg-[#f5f5f5] mx-auto p-[30px] max-w-[700px]">
      <h1 class="mb-6 font-bold text-2xl text-center">Bài tập JavaScript</h1>

      <!-- BÀI 1 -->
      <div
        class="bg-white shadow-[0_2px_8px_rgba(0,0,0,0.1)] mb-6 p-[25px] rounded-[10px]"
      >
        <h2 class="mb-5 font-bold text-xl">
          Bài 1: Hệ thống tính điểm và xếp loại học sinh
        </h2>

        <div class="mb-[15px]">
          <label for="toan" class="block mb-[5px] font-bold"> Điểm Toán </label>

          <input
            type="number"
            id="toan"
            step="0.1"
            class="p-[10px] border border-gray-300 focus:border-blue-500 rounded-[5px] outline-none w-full"
          />
        </div>

        <div class="mb-[15px]">
          <label for="van" class="block mb-[5px] font-bold"> Điểm Văn </label>

          <input
            type="number"
            id="van"
            step="0.1"
            class="p-[10px] border border-gray-300 focus:border-blue-500 rounded-[5px] outline-none w-full"
          />
        </div>

        <div class="mb-[15px]">
          <label for="anh" class="block mb-[5px] font-bold"> Điểm Anh </label>

          <input
            type="number"
            id="anh"
            step="0.1"
            class="p-[10px] border border-gray-300 focus:border-blue-500 rounded-[5px] outline-none w-full"
          />
        </div>
        <div class="flex items-center gap-3 mt-5">
          <button
            onclick="xuLyBai1()"
            class="bg-blue-600 hover:opacity-80 px-[15px] py-[10px] border-0 rounded-[5px] text-white cursor-pointer"
          >
            Tính điểm
          </button>

          <div id="ketQuaBai1" class="flex flex-1 justify-center items-center bg-blue-50 shadow-sm px-5 py-5 border border-blue-200 rounded-xl font-bold text-blue-700"></div>
        </div>
      </div>

      <!-- BÀI 2 -->
      <div
        class="bg-white shadow-[0_2px_8px_rgba(0,0,0,0.1)] mb-6 p-[25px] rounded-[10px]"
      >
        <h2 class="mb-5 font-bold text-xl">
          Bài 2: Chuyển đổi số sang ngày trong tuần
        </h2>

        <div class="mb-[15px]">
          <label for="thu" class="block mb-[5px] font-bold">
            Nhập số từ 1 đến 7
          </label>

          <input
            type="number"
            id="thu"
            class="p-[10px] border border-gray-300 focus:border-blue-500 rounded-[5px] outline-none w-full"
          />
        </div>
        <div class="flex items-center gap-3 mt-5">
          <button
            onclick="xuLyBai2()"
            class="bg-blue-600 hover:opacity-80 px-[15px] py-[10px] border-0 rounded-[5px] text-white cursor-pointer"
          >
            Kiểm tra
          </button>

          <div
            id="ketQuaBai2"
            class="flex flex-1 justify-center items-center bg-blue-50 shadow-sm px-5 py-5 border border-blue-200 rounded-xl font-bold text-blue-700"
          ></div>
        </div>
      </div>

      <!-- BÀI 3 -->
      <div
        class="bg-white shadow-[0_2px_8px_rgba(0,0,0,0.1)] p-[25px] rounded-[10px]"
      >
        <h2 class="mb-5 font-bold text-xl">Bài 3: Tính tiền cước Taxi</h2>

        <div class="mb-[15px]">
          <label for="soKm" class="block mb-[5px] font-bold"> Số km </label>

          <input
            type="number"
            id="soKm"
            step="0.1"
            class="p-[10px] border border-gray-300 focus:border-blue-500 rounded-[5px] outline-none w-full"
          />
        </div>
        <div class="flex items-center gap-3 mt-5">
          <button
            onclick="xuLyBai3()"
            class="bg-blue-600 hover:opacity-80 px-[15px] py-[10px] border-0 rounded-[5px] text-white cursor-pointer"
          >
            Tính tiền
          </button>

          <div
            id="ketQuaBai3"
            class="flex flex-1 justify-center items-center bg-blue-50 shadow-sm px-5 py-5 border border-blue-200 rounded-xl font-bold text-blue-700"
          ></div>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
