<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kết quả Bài 1-3</title>
  <!-- Nhúng Tailwind qua CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">
  <h1 class="mb-6 font-bold text-blue-700 text-2xl">Kết quả Bài 1 - 3</h1>

  <!-- Bài 1 -->
  <div class="bg-white shadow-md mb-6 p-4 rounded-lg">
    <h2 class="mb-2 font-semibold text-green-600 text-xl">Bài 1: Từ khóa tìm kiếm</h2>
    <pre id="result1" class="bg-gray-50 p-3 border rounded"></pre>
  </div>

  <!-- Bài 2 -->
  <div class="bg-white shadow-md mb-6 p-4 rounded-lg">
    <h2 class="mb-2 font-semibold text-purple-600 text-xl">Bài 2: Giỏ hàng & Voucher</h2>
    <pre id="result2" class="bg-gray-50 p-3 border rounded"></pre>
    <button id="btnVoucher" class="bg-purple-600 hover:bg-purple-700 mt-3 px-4 py-2 rounded text-white">
      Áp dụng mã giảm giá
    </button>
  </div>

  <!-- Bài 3 -->
  <div class="bg-white shadow-md p-4 rounded-lg">
    <h2 class="mb-2 font-semibold text-red-600 text-xl">Bài 3: Doanh thu toàn hệ thống</h2>
    <pre id="result3" class="bg-gray-50 p-3 border rounded"></pre>
  </div>

  <script src="main.js"></script>
</body>
</html>
