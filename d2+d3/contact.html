<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <title>Liên Hệ</title>
  </head>
  <body>
    <main>
      <h1>Liên Hệ</h1>

      <section class="contact-info">
        <p>
          F8 luôn lắng nghe và tiếp nhận mọi ý kiến đóng góp của bạn. Hãy liên
          hệ với chúng mình bằng cách điền thông tin vào form dưới đây. Chúng
          mình sẽ phản hồi bạn trong thời gian sớm nhất.
        </p>

        <p class="contact-item">
          <i class="fa-solid fa-house"></i>
          Số 1, ngõ 41, Trần Duy Hưng, Cầu Giấy, Hà Nội
        </p>

        <p class="contact-item">
          <i class="fa-solid fa-phone"></i>
          <a class="contact-link" href="tel:0819198989"> 0819198989 </a>
        </p>

        <p class="contact-item">
          <i class="fa-solid fa-envelope"></i>
          <a class="contact-link" href="mailto:contact@f8.edu.vn">
            contact@f8.edu.vn
          </a>
        </p>
      </section>

      <section class="contact-form">
        <form action="#" method="post">
          <div class="form-group">
            <label for="name">Họ và tên</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Nhập họ và tên"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Nhập email"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Điện thoại</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="Nhập số điện thoại"
            />
          </div>

          <div class="form-group">
            <label for="content">Nội dung</label>
            <textarea
              id="content"
              name="content"
              rows="5"
              placeholder="Nhập nội dung"
              required
            ></textarea>
          </div>

          <button type="submit">Gửi đi</button>
        </form>
      </section>

      <section class="contact-map">
        <iframe
          title="F8 Google Maps"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3724.6767250287837!2d105.79864587503188!3d21.006771580636554!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135acc0f1d1d4b1%3A0x31d3f2e9465d9f1!2zMSBOZ8O1IDQxIFRy4bqnbiBEdXkgSMawbmcsIFRydW5nIEjDsmEsIEPhuqd1IEdp4bqleSwgSMOgIE7hu5lp!5e0!3m2!1svi!2svn!4v1754210000000!5m2!1svi!2svn"
          width="100%"
          height="350"
          style="border: 0"
          loading="lazy"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade"
        >
        </iframe>
      </section>
    </main>
  </body>
</html>
