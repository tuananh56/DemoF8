
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/products.js" defer></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <header class="bg-white shadow-sm px-6 py-4">
        <div class="flex justify-between items-center mx-auto max-w-7xl">
            <h1 class="font-bold text-blue-600 text-2xl">Product Store</h1>
            <a href="../index.html" class="text-blue-600 hover:underline">Trang chủ</a>
        </div>
    </header>

    <main class="mx-auto p-6 max-w-7xl">
        <div class="flex justify-between items-center mb-6">
            <h2 class="font-bold text-2xl">Danh sách sản phẩm</h2>
            <button id="reloadBtn"
                class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-white">
                Tải lại
            </button>
        </div>

        <p id="loading" class="hidden py-10 text-blue-600 text-center">
            Đang tải dữ liệu...
        </p>

        <div id="error" class="hidden bg-red-100 p-5 rounded-lg text-red-600 text-center">
            <p id="errorMessage">Đã xảy ra lỗi khi tải dữ liệu.</p>
            <button id="retryBtn"
                class="bg-red-600 hover:bg-red-700 mt-3 px-4 py-2 rounded-lg text-white">
                Thử lại
            </button>
        </div>

        <div id="productList"
            class="gap-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4">
        </div>

        <div id="productDetail"
            class="hidden z-50 fixed inset-0 flex justify-center items-center bg-black/50 p-4">
            <div class="relative bg-white p-6 rounded-xl w-full max-w-2xl">
                <button id="closeDetail"
                    class="top-3 right-4 absolute text-gray-500 hover:text-black text-2xl">
                    &times;
                </button>
                <div id="detailContent"></div>
            </div>
        </div>
    </main>
</body>
</html>
