<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Demo Random HEX, Giỏ hàng & OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="flex flex-col justify-center items-center bg-gray-100 p-6 min-h-screen"
  >
    <h1 class="mb-8 font-bold text-blue-600 text-3xl">Demo JavaScript</h1>

    <!-- Random HEX -->
    <div class="bg-white shadow-md mb-6 p-6 rounded-lg w-full max-w-md">
      <h2 class="mb-4 font-semibold text-xl">Random HEX Color</h2>
      <button
        id="colorButton"
        onclick="showRandomColor()"
        class="bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded text-white"
      >
        Tạo màu ngẫu nhiên
      </button>
      <p
        id="colorResult"
        class="bg-blue-50 mt-3 p-3 border border-blue-200 rounded-2xl font-mono text-2xl text-center"
      ></p>
    </div>

    <!-- Giỏ hàng -->
    <div class="bg-white shadow-md mb-6 p-6 rounded-lg w-full max-w-md">
      <h2 class="mb-4 font-semibold text-xl">Bộ lọc & Sắp xếp Giỏ hàng</h2>
      <div class="mb-4">
        <label for="category" class="block font-medium">Chọn danh mục:</label>
        <select id="category" class="mt-1 p-2 border rounded w-full">
          <option value="Tất cả">Tất cả</option>
          <option value="Điện thoại">Điện thoại</option>
          <option value="Laptop">Laptop</option>
          <option value="Phụ kiện">Phụ kiện</option>
        </select>
      </div>

      <div class="mb-4">
        <label for="sort" class="block font-medium">Chọn kiểu sắp xếp:</label>
        <select id="sort" class="mt-1 p-2 border rounded w-full">
          <option value="default">Mặc định</option>
          <option value="asc">Giá tăng dần</option>
          <option value="desc">Giá giảm dần</option>
        </select>
      </div>

      <button
        onclick="handleFilterSort()"
        class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded text-white"
      >
        Xem kết quả
      </button>

      <div class="bg-blue-50 mt-6 p-4 border rounded-lg">
        <h3 class="mb-2 font-semibold text-lg">Kết quả:</h3>
        <pre
          id="result"
          class="bg-white p-3 border rounded overflow-x-auto text-sm"
        ></pre>

        <h3 class="mt-4 font-semibold text-lg">Tổng tiền:</h3>
        <p id="total" class="mt-2 font-bold text-red-600 text-xl"></p>
      </div>
    </div>

    <!-- OTP -->
    <div class="bg-white shadow-md p-6 rounded-lg w-full max-w-md">
      <h2 class="mb-4 font-semibold text-xl">OTP ngẫu nhiên</h2>
      <button
        onclick="showOTP()"
        class="bg-purple-500 hover:bg-purple-600 px-4 py-2 rounded text-white"
      >
        Tạo mã OTP ngẫu nhiên
      </button>
      <div class="bg-blue-50 mt-3 p-3 border rounded-2">
        <p id="otpResult" class="mt-auto rounded-2xl font-mono text-2xl text-center"></p>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
